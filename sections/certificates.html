<section class="certificates-section" aria-labelledby="certificates-heading">
  <div class="section-heading certificates-heading">
    <span class="certificate-heading-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="3" width="16" height="13" rx="2"/><path d="M8 7h8M8 11h5M9 16v5l3-2 3 2v-5"/></svg>
    </span>
    <h2 id="certificates-heading">Certificates</h2>
  </div>
  <div class="certificate-list">
    <article class="certificate-card">
      <h3>Data Analytics Certificate</h3>
      <p>By <span>Issuer name</span></p>
      <button class="certificate-preview" type="button" data-certificate-preview="Data Analytics Certificate" aria-label="Preview sample Data Analytics Certificate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        Preview
      </button>
    </article>
    <article class="certificate-card">
      <h3>Business Intelligence Certificate</h3>
      <p>By <span>Issuer name</span></p>
      <button class="certificate-preview" type="button" data-certificate-preview="Business Intelligence Certificate" aria-label="Preview sample Business Intelligence Certificate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        Preview
      </button>
    </article>
  </div>
  <dialog class="certificate-dialog case-study-panel" aria-label="Certificate preview">
    <form method="dialog"><button class="certificate-close case-study-close" aria-label="Close certificate preview"></button></form>
  </dialog>
</section>
